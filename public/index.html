<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Task Manager</h1>
        
        <form id="task-form">
            <input type="text" id="task-title" placeholder="What needs to be done?" required autocomplete="off">
            <input type="text" id="task-desc" placeholder="Details (optional)" autocomplete="off">
            
            <button id="addTaskBtn" type="submit">
                <span id="buttonText">Add Task</span>
                <span id="loader" class="loader"></span>
            </button>
        </form>

        <ul id="task-list"></ul>
    </div>

    <script src="app.js"></script>
</body>
</html>
